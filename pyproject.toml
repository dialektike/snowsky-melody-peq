[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "snowsky-melody-peq"
version = "0.1.0"
description = "Unofficial USB HID parametric EQ control for the FiiO SnowSky Melody"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "snowsky-melody-peq contributors" }]
keywords = ["audio", "snowsky", "melody", "fiio", "peq", "equalizer", "usb-hid", "dac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "hidapi>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.urls]
Homepage      = "https://github.com/YOUR_USERNAME/snowsky-melody-peq"
Repository    = "https://github.com/YOUR_USERNAME/snowsky-melody-peq"
Issues        = "https://github.com/YOUR_USERNAME/snowsky-melody-peq/issues"
Documentation = "https://github.com/YOUR_USERNAME/snowsky-melody-peq#readme"

[project.scripts]
melody-peq = "snowsky_melody_peq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/snowsky_melody_peq"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
